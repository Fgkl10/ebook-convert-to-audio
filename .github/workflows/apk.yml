name: APK

# Builds the Android app signed with the project's release key (android/docs/decisions.md A-020).
# - A push to master that changes the app: the APK is kept as this run's artifact (90 days).
# - A version tag (v0.5.0): the APK is also published as a GitHub Release.
# Pull requests are checked by ci.yml; they don't get the signing key.
# Tags come through `create`, because a `paths` filter would also apply to a tag push (which changes no files).
on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  create:
  workflow_dispatch:

permissions:
  contents: write # only the release step needs it

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    # `create` also fires for new branches: only version tags build.
    if: github.event_name != 'create' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version code is the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Signing key and version
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing; an unsigned APK is never published."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "APK_NAME=ebook-audio-${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=ebook-audio-$(git rev-list --count HEAD)-$(git rev-parse --short HEAD).apk" >> "$GITHUB_ENV"
          fi

      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/$APK_NAME"

      - name: Check the signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$APKSIGNER" verify --print-certs "../dist/$APK_NAME" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "CN=Ebook Audio" "$RUNNER_TEMP/certs.txt"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "../dist/$APK_NAME" --title "$GITHUB_REF_NAME" --generate-notes
