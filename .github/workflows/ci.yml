name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Install the commands (D-033)
        run: |
          pip install -e .
          ebook-normalize --help
          ebook-convert --help
          EBOOK_AUDIO_DATA="$RUNNER_TEMP/ebook-data" ebook-server --help

      - name: Run tests
        run: python -m pytest tests/ -v

  # The Android app (android/, M4): unit tests, lint and a debug APK. The runner's Android SDK gets the missing
  # platform from AGP on the first run.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: android/app/build/reports/
